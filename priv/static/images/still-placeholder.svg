<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <!-- A STAND-IN FOR A CAPTURED STILL. There are no captured stills in the data
       and no way to make one yet, so without this, `still` — a quarter of the
       design — would be a state nobody could look at while it is being settled.
       It goes when there is a way to capture one.

       FLAT, AND NOTHING IN IT IS A SHAPE. It was a blurred wash with a sun and
       three hills in it, and both of those were mistakes of the same kind: the
       hills read as an illustration and the blur read as a photograph, and the
       moment a stand-in looks like content it stops standing in for content and
       starts competing with the design it is there to let somebody judge. One
       flat colour is a rectangle where a picture will be, which is all it was
       ever asked to be. -->
  <rect width="1200" height="900" fill="#8d8391" />
</svg>
