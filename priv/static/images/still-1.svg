<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- A STAND-IN FOR A CAPTURED STILL, and it has to look like a PHOTOGRAPH or it
       does not stand in for one. The first pair were dark gradients running to
       near-black, which under a scrim were indistinguishable from a frame that had
       failed to load — the exact fault they were there to help judge. Light,
       warm, and out of focus: what a picture looks like when you are not looking
       at it. Goes when this app can capture one. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#cfd8dd"/><stop offset="0.55" stop-color="#e3d9c8"/>
      <stop offset="1" stop-color="#b7a891"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.24" r="0.45">
      <stop offset="0" stop-color="#fff4dd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff4dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="0.18" cy="0.86" r="0.6">
      <stop offset="0" stop-color="#7f8f63" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7f8f63" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <rect width="400" height="400" fill="url(#leaf)"/>
  <rect width="400" height="400" fill="url(#sun)"/>
</svg>
