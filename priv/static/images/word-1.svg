<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- A STAND-IN FOR A PICTURE ATTACHED TO A WORD. Colour only, no shapes: the
       moment a placeholder looks like an illustration it stops standing in for
       content and starts competing with the design. Goes when uploads arrive. -->
  <defs><linearGradient id="w1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a7f8e"/>
    <stop offset="1" stop-color="#3d4144"/>
  </linearGradient></defs>
  <rect width="120" height="120" fill="url(#w1)"/>
</svg>
